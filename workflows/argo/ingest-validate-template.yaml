# The Phase 2/3 ingest -> validate -> transform DAG (BUILD_PLAN.md §10). One
# Workflow per file, submitted by engine/ingestion_service.py in response to a
# platform.catalog.file.* NATS event. Kept as a reusable WorkflowTemplate so
# the Ingestion Service only has to submit lightweight Workflow instances that
# reference it with arguments, rather than generating the full DAG each time.
#
# `transform` only runs when `validate` actually passed (its
# validation_result output is PASSED, not REJECTED) — same "don't spend
# compute on data that already failed a cheap check" reasoning as running
# input validation before transform at all (BUILD_PLAN §6).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ingest-validate
  namespace: data-platform
spec:
  entrypoint: main
  serviceAccountName: argo-workflow
  # Phase 16 (BUILD_PLAN_COMMERCIAL.md): a stable label every pod this
  # template creates gets, regardless of which step — lets a NetworkPolicy
  # (or anything else) target "any engine-step pod" without depending on
  # Argo's own auto-generated labels.
  podMetadata:
    labels:
      network-role: engine-step
  # Shared emptyDir for the /tmp any step's container might incidentally need
  # under its now-read-only root filesystem (e.g. a library spooling scratch
  # data) — distinct from Argo's own /var/run/argo outputs volume, which the
  # emissary executor manages itself.
  volumes:
    - name: tmp
      emptyDir: {}
  arguments:
    parameters:
      - name: file-id
      - name: source
      - name: dataset-id
      - name: dataset-version
      - name: modality
      - name: location
      - name: representations
        value: ""  # empty = pipeline default (see engine/pipelines/*/DEFAULT_REPRESENTATIONS)
  templates:
    - name: main
      dag:
        tasks:
          - name: ingest
            template: ingest
          - name: validate
            template: validate
            dependencies: [ingest]
            arguments:
              parameters:
                - name: location
                  value: "{{tasks.ingest.outputs.parameters.raw-location}}"
          - name: transform
            template: transform
            dependencies: [validate]
            when: "{{tasks.validate.outputs.parameters.result}} == PASSED"
            arguments:
              parameters:
                - name: location
                  value: "{{tasks.validate.outputs.parameters.validated-location}}"

    - name: ingest
      inputs:
        parameters:
          - name: file-id
            value: "{{workflow.parameters.file-id}}"
          - name: source
            value: "{{workflow.parameters.source}}"
          - name: dataset-id
            value: "{{workflow.parameters.dataset-id}}"
          - name: location
            value: "{{workflow.parameters.location}}"
      # Phase 16: non-root, no privilege escalation, no Linux capabilities,
      # read-only root filesystem — this step only reads from and writes to
      # MinIO/the catalog API and Argo's own outputs volume, nothing that
      # needs to write to its own container filesystem.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        image: engine-steps:phase2
        imagePullPolicy: IfNotPresent
        command: [python, -m, engine.steps.ingest]
        args:
          - --file-id
          - "{{inputs.parameters.file-id}}"
          - --source
          - "{{inputs.parameters.source}}"
          - --dataset-id
          - "{{inputs.parameters.dataset-id}}"
          - --location
          - "{{inputs.parameters.location}}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        env:
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: MINIO_ENDPOINT
            value: http://minio.data-platform.svc.cluster.local:9000
          # Phase 12 (BUILD_PLAN_COMMERCIAL.md): connectors/storage.py no
          # longer has a plaintext-credential fallback default — these must
          # be supplied explicitly, from a Secret created imperatively via
          # `kubectl create secret ...`, never committed to git.
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: rootUser
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: rootPassword
          - name: CATALOG_URL
            value: http://catalog.data-platform.svc.cluster.local:8000
          # Phase 13 (BUILD_PLAN_COMMERCIAL.md): required by CatalogClient's
          # X-Internal-Secret header — catalog/api.py's internal_router
          # rejects requests without it.
          - name: INTERNAL_API_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-internal-api-secret
                key: INTERNAL_API_SECRET
      outputs:
        parameters:
          - name: raw-location
            valueFrom:
              path: /var/run/argo/outputs/raw_location.txt

    - name: validate
      inputs:
        parameters:
          - name: file-id
            value: "{{workflow.parameters.file-id}}"
          - name: modality
            value: "{{workflow.parameters.modality}}"
          - name: location
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        image: engine-steps:phase2
        imagePullPolicy: IfNotPresent
        command: [python, -m, engine.steps.validate]
        args:
          - --file-id
          - "{{inputs.parameters.file-id}}"
          - --modality
          - "{{inputs.parameters.modality}}"
          - --location
          - "{{inputs.parameters.location}}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        env:
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: MINIO_ENDPOINT
            value: http://minio.data-platform.svc.cluster.local:9000
          # Phase 12 (BUILD_PLAN_COMMERCIAL.md): connectors/storage.py no
          # longer has a plaintext-credential fallback default — these must
          # be supplied explicitly, from a Secret created imperatively via
          # `kubectl create secret ...`, never committed to git.
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: rootUser
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: rootPassword
          - name: CATALOG_URL
            value: http://catalog.data-platform.svc.cluster.local:8000
          # Phase 13 (BUILD_PLAN_COMMERCIAL.md): required by CatalogClient's
          # X-Internal-Secret header — catalog/api.py's internal_router
          # rejects requests without it.
          - name: INTERNAL_API_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-internal-api-secret
                key: INTERNAL_API_SECRET
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /var/run/argo/outputs/validation_result.txt
          - name: validated-location
            valueFrom:
              path: /var/run/argo/outputs/validated_location.txt

    - name: transform
      inputs:
        parameters:
          - name: file-id
            value: "{{workflow.parameters.file-id}}"
          - name: source
            value: "{{workflow.parameters.source}}"
          - name: dataset-id
            value: "{{workflow.parameters.dataset-id}}"
          - name: dataset-version
            value: "{{workflow.parameters.dataset-version}}"
          - name: modality
            value: "{{workflow.parameters.modality}}"
          - name: representations
            value: "{{workflow.parameters.representations}}"
          - name: location
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        image: engine-steps:phase2
        imagePullPolicy: IfNotPresent
        command: [python, -m, engine.steps.transform]
        args:
          - --file-id
          - "{{inputs.parameters.file-id}}"
          - --source
          - "{{inputs.parameters.source}}"
          - --dataset-id
          - "{{inputs.parameters.dataset-id}}"
          - --dataset-version
          - "{{inputs.parameters.dataset-version}}"
          - --modality
          - "{{inputs.parameters.modality}}"
          - --location
          - "{{inputs.parameters.location}}"
          - --representations
          - "{{inputs.parameters.representations}}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Higher than ingest/validate: transform is where RDKit/Biopython/
        # Pillow featurization actually runs, the one step in this DAG doing
        # real compute, not just data movement.
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        env:
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: MINIO_ENDPOINT
            value: http://minio.data-platform.svc.cluster.local:9000
          # Phase 12 (BUILD_PLAN_COMMERCIAL.md): connectors/storage.py no
          # longer has a plaintext-credential fallback default — these must
          # be supplied explicitly, from a Secret created imperatively via
          # `kubectl create secret ...`, never committed to git.
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: rootUser
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: rootPassword
          - name: CATALOG_URL
            value: http://catalog.data-platform.svc.cluster.local:8000
          # Phase 13 (BUILD_PLAN_COMMERCIAL.md): required by CatalogClient's
          # X-Internal-Secret header — catalog/api.py's internal_router
          # rejects requests without it.
          - name: INTERNAL_API_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-internal-api-secret
                key: INTERNAL_API_SECRET
