# Nightly PubChem sync (BUILD_PLAN.md §10 Phase 7). Same shape as
# chembl-sync-cronworkflow.yaml — see that file's comment for why this is a
# single-step Workflow rather than a WorkflowTemplate DAG.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: pubchem-nightly-sync
  namespace: data-platform
spec:
  schedules:
    - "15 2 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  workflowSpec:
    serviceAccountName: argo-workflow
    entrypoint: sync
    # Phase 16 (BUILD_PLAN_COMMERCIAL.md): stable label for NetworkPolicy
    # targeting, matching ingest-validate-template.yaml's convention.
    podMetadata:
      labels:
        network-role: connector-sync
    volumes:
      - name: tmp
        emptyDir: {}
    templates:
      - name: sync
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          image: connectors:phase7
          imagePullPolicy: IfNotPresent
          command: [python, -m, connectors.pubchem_connector]
          args: ["--dataset-id", "pubchem-nightly-sync"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MINIO_ENDPOINT
              value: http://minio.data-platform.svc.cluster.local:9000
            # Phase 12 (BUILD_PLAN_COMMERCIAL.md): connectors/storage.py no
            # longer has a plaintext-credential fallback default — these must
            # be supplied explicitly, from a Secret created imperatively via
            # `kubectl create secret ...`, never committed to git.
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
            - name: NATS_URL
              value: nats://nats.data-platform.svc.cluster.local:4222
            - name: CATALOG_URL
              value: http://catalog.data-platform.svc.cluster.local:8000
            # Phase 13 (BUILD_PLAN_COMMERCIAL.md): required by CatalogClient's
            # X-Internal-Secret header — catalog/api.py's internal_router
            # rejects requests without it.
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-internal-api-secret
                  key: INTERNAL_API_SECRET
