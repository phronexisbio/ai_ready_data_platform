# Nightly backup (BUILD_PLAN.md §10 Phase 10): pg_dump of the catalog +
# mc mirror of the raw/ and features/ data lake zones into MinIO's backups/
# bucket. Scheduled after both connector syncs (chembl 2am, pubchem 2:15am
# UTC — see chembl/pubchem-sync-cronworkflow.yaml) so a night's newly-synced
# data is included.
#
# "or off-box" per BUILD_PLAN §10: this mirrors within the same MinIO
# instance, not to genuinely separate infrastructure — there's no second
# object store available in this environment. That protects against
# catalog-level mistakes (bad migration, accidental deletes) but not against
# the MinIO instance itself being lost; genuine off-box storage is a real gap,
# noted rather than silently assumed away.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: nightly-backup
  namespace: data-platform
spec:
  schedules:
    - "0 3 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  workflowSpec:
    serviceAccountName: argo-workflow
    entrypoint: backup
    # Phase 16 (BUILD_PLAN_COMMERCIAL.md): stable label for NetworkPolicy
    # targeting, matching the other workflow templates' convention.
    podMetadata:
      labels:
        network-role: backup
    volumes:
      - name: tmp
        emptyDir: {}
    templates:
      - name: backup
        # runAsUser 999: the postgres:18 base image's own built-in "postgres"
        # user — reuses an identity the image already knows how to run pg_dump
        # under, rather than an arbitrary UID that might not have the right
        # permissions on files the image itself laid down.
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
          seccompProfile:
            type: RuntimeDefault
        container:
          image: backup:phase10
          imagePullPolicy: IfNotPresent
          # Explicit command: the emissary executor otherwise tries to look up
          # the image's entrypoint from Docker Hub, which fails for images
          # that only exist locally/in kind (never pushed to a registry).
          command: ["/usr/local/bin/backup.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # Phase 17 (BUILD_PLAN_COMMERCIAL.md): pgpool, not the raw
            # postgresql service — pgpool is the failover-aware endpoint that
            # always routes to whichever node is currently primary.
            - name: POSTGRES_HOST
              value: postgres-pgpool.data-platform.svc.cluster.local
            - name: POSTGRES_USER
              value: catalog
            # Phase 12 (BUILD_PLAN_COMMERCIAL.md): credentials come from Secrets
            # created imperatively via `kubectl create secret ...`, never
            # committed to git.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: catalog
            - name: MINIO_ENDPOINT
              value: http://minio.data-platform.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
