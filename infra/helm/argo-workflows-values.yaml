# Single-namespace mode: the controller only watches/manages Workflows in
# data-platform, matching the "everything in one namespace" simplicity of
# the rest of this cluster at this stage (BUILD_PLAN §8 — multi-tenancy is
# explicitly deferred).
singleNamespace: true

controller:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    # Phase 16 (BUILD_PLAN_COMMERCIAL.md): chart's own default securityContext
    # is already fully hardened (non-root, read-only root fs, dropped caps) —
    # only resource limits were missing.
    limits:
      memory: 512Mi
      cpu: 500m

# UI not needed yet — verification happens via kubectl. Cuts pod count/RAM.
server:
  enabled: false

# No workflow-scoped SSO/RBAC concerns yet (single user).
workflow:
  serviceAccount:
    create: true
