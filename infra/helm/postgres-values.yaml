auth:
  username: catalog
  database: catalog
  # Phase 12 (BUILD_PLAN_COMMERCIAL.md): passwords live in the
  # `postgres-credentials` Secret (keys `password`/`postgres-password`),
  # created imperatively via `kubectl create secret ...`, never committed to
  # git. existingSecret makes the chart ignore any password value here.
  existingSecret: postgres-credentials
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  persistence:
    enabled: true
    storageClass: standard
    size: 2Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m

architecture: standalone
