# RETIRED as of Phase 17 (BUILD_PLAN_COMMERCIAL.md) — the standalone
# bitnami/postgresql release this values file drove was replaced by the
# bitnami/postgresql-ha release (infra/helm/postgres-ha-values.yaml), for
# real automatic primary failover via repmgr. Kept here only as a record of
# what v2/Phase 12 originally deployed; not applied to the live cluster.
auth:
  username: catalog
  database: catalog
  # Phase 12 (BUILD_PLAN_COMMERCIAL.md): passwords live in the
  # `postgres-credentials` Secret (keys `password`/`postgres-password`),
  # created imperatively via `kubectl create secret ...`, never committed to
  # git. existingSecret makes the chart ignore any password value here.
  existingSecret: postgres-credentials
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  persistence:
    enabled: true
    storageClass: standard
    size: 2Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    # Phase 16 (BUILD_PLAN_COMMERCIAL.md): chart's own default securityContext
    # is already fully hardened (non-root, read-only root fs, dropped caps) —
    # only resource limits were missing.
    limits:
      memory: 1Gi
      cpu: 500m

architecture: standalone
