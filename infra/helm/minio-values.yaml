mode: standalone

# Phase 12 (BUILD_PLAN_COMMERCIAL.md): root credentials live in the
# `minio-credentials` Secret (keys `rootUser`/`rootPassword`), created
# imperatively via `kubectl create secret ...`, never committed to git.
# rootUser/rootPassword above are ignored once existingSecret is set.
existingSecret: minio-credentials

persistence:
  enabled: true
  storageClass: standard
  size: 5Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m

buckets:
  - name: landing
    policy: none
  - name: raw
    policy: none
  - name: validated
    policy: none
  - name: standardized
    policy: none
  - name: features
    policy: none
  - name: archive
    policy: none
  - name: rejected
    policy: none

consoleService:
  type: ClusterIP
service:
  type: ClusterIP
