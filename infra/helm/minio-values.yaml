# Phase 17 (BUILD_PLAN_COMMERCIAL.md): erasure-coded distributed mode
# (4 nodes, 1 drive each — the chart's own minimum for erasure coding)
# replaces the single-instance standalone mode. Still the same chart/release
# name (`minio`), so every consumer's `minio.data-platform.svc.cluster.local`
# hostname is unchanged — cut over by snapshotting all buckets out with `mc
# mirror`, reinstalling under this mode, then mirroring the snapshot back in.
mode: distributed
replicas: 4
drivesPerNode: 1
pools: 1

# Phase 12 (BUILD_PLAN_COMMERCIAL.md): root credentials live in the
# `minio-credentials` Secret (keys `rootUser`/`rootPassword`), created
# imperatively via `kubectl create secret ...`, never committed to git.
# rootUser/rootPassword above are ignored once existingSecret is set.
existingSecret: minio-credentials

persistence:
  enabled: true
  storageClass: standard
  size: 5Gi

# Phase 16 (BUILD_PLAN_COMMERCIAL.md): the chart already runs as a non-root
# user by default (securityContext.runAsUser/runAsGroup: 1000, unchanged
# here) — capabilities/privilege-escalation weren't. readOnlyRootFilesystem
# stays the chart's own default (false): MinIO's own image expects to write
# operational state beyond just the data mount, and this hasn't been
# verified safe to override.
containerSecurityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m

buckets:
  - name: landing
    policy: none
  - name: raw
    policy: none
  - name: validated
    policy: none
  - name: standardized
    policy: none
  - name: features
    policy: none
  - name: archive
    policy: none
  - name: rejected
    policy: none
  # Phase 17: previously only ever created ad hoc by infra/backup/backup.sh's
  # own `mc mb --ignore-existing` — declared explicitly now that it holds
  # real nightly backup data worth tracking the same way the data-lake zones
  # already are.
  - name: backups
    policy: none

consoleService:
  type: ClusterIP
service:
  type: ClusterIP
