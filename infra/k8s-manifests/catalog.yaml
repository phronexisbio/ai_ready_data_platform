apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: data-platform
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      # Phase 16 (BUILD_PLAN_COMMERCIAL.md): pod ran with default (root)
      # privileges and an unbounded filesystem before this — no functional
      # reason for either, catalog is a stateless FastAPI service.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Phase 17 (BUILD_PLAN_COMMERCIAL.md): schema changes now go through
      # Alembic (catalog/alembic/), not Base.metadata.create_all() on every
      # app startup. Same initContainer pattern already used for NATS's
      # Phase 16 chown fix — migrations run to completion once, before the
      # main container (which no longer touches schema at all) ever starts.
      initContainers:
        - name: migrate
          image: catalog:phase1
          imagePullPolicy: IfNotPresent
          command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
          workingDir: /app
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
      containers:
        - name: catalog
          image: catalog:phase1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          env:
            # Starlette's UploadFile spools large uploads to a temp file once
            # they exceed its in-memory threshold — needs a writable /tmp
            # even under a read-only root filesystem (see the volume below).
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # DATABASE_URL / MinIO creds: Phase 12 (BUILD_PLAN_COMMERCIAL.md) moved
            # these out of plaintext values into Secrets created imperatively
            # (`kubectl create secret ...`), never committed to git.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.data-platform.svc.cluster.local:9090
            - name: MINIO_ENDPOINT
              value: http://minio.data-platform.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
            # Phase 13 (BUILD_PLAN_COMMERCIAL.md): the shared secret every
            # internal caller (connectors, engine steps, via CatalogClient)
            # must present to catalog/api.py's internal_router. Replaces the
            # old single PUBLIC_API_KEY, which /public/* no longer uses at
            # all — public callers now authenticate with per-customer keys
            # looked up in the api_keys table (catalog/manage_api_keys.py).
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-internal-api-secret
                  key: INTERNAL_API_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          # Phase 16: a hung-but-not-crashed process (readinessProbe alone
          # would just stop getting traffic, never actually restart) is now
          # caught by this — same endpoint, more tolerant timing so a slow
          # request doesn't trigger an unnecessary restart.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: data-platform
spec:
  selector:
    app: catalog
  ports:
    - port: 8000
      targetPort: 8000
