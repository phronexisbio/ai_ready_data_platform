apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: data-platform
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      containers:
        - name: catalog
          image: catalog:phase1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # DATABASE_URL / MinIO creds: Phase 12 (BUILD_PLAN_COMMERCIAL.md) moved
            # these out of plaintext values into Secrets created imperatively
            # (`kubectl create secret ...`), never committed to git — same
            # pattern as PUBLIC_API_KEY below, now applied everywhere.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.data-platform.svc.cluster.local:9090
            - name: MINIO_ENDPOINT
              value: http://minio.data-platform.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
            # Protects catalog/public_api.py's /public/* endpoints — the only
            # surface exposed through the Cloudflare Tunnel. Value lives in a
            # Secret created imperatively (`kubectl create secret ...`), never
            # committed to git — see CLAUDE.md's frontend section.
            - name: PUBLIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-public-api-key
                  key: PUBLIC_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: data-platform
spec:
  selector:
    app: catalog
  ports:
    - port: 8000
      targetPort: 8000
